<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Triage Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        #chat-container {
            width: 100%;
            max-width: 650px;
            margin: auto;
            margin-top: 30px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        #messages {
            height: 70vh;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .msg {
            margin: 12px 0;
            padding: 12px;
            border-radius: 10px;
            width: fit-content;
            max-width: 85%;
            line-height: 1.4;
        }

        .user {
            background: #d1e7ff;
            margin-left: auto;
        }

        .assistant {
            background: #e9e9e9;
            margin-right: auto;
        }

        .follow-card {
            background: #fff4d2 !important;
            border-left: 5px solid #f2c200;
        }

        .final-card {
            background: #e3ffd9 !important;
            border-left: 5px solid #54b435;
        }

        #form {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        #prompt {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #aaa;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            background: #007bff;
            color: white;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>🩺 Medical Triage Assistant</h2>

    <div id="messages"></div>

    <form id="form">
        <input type="text" id="prompt" placeholder="Describe your symptoms..." required>
        <button type="submit">Send</button>
    </form>
</div>


<script>
    const form = document.getElementById("form");
    const promptInput = document.getElementById("prompt");
    const messagesDiv = document.getElementById("messages");

    function addMessage(role, text) {

        // remove wrapping quotes if LLM outputs them
        text = text.replace(/^"(.*)"$/, "$1");

        // convert both \n and \\n into actual line breaks
        text = text.replace(/\\n/g, "<br>").replace(/\n/g, "<br>");

        const div = document.createElement("div");
        div.classList.add("msg", role);

        // FOLLOW-UP QUESTIONS FORMATTING
        if (text.startsWith("(type: follow_up)")) {

            let cleaned = text
                .replace("(type: follow_up)", "")
                .trim()
                .replace(/<br>Q1:/, "<br>1️⃣ ")
                .replace(/<br>Q2:/, "<br>2️⃣ ")
                .replace(/<br>Q3:/, "<br>3️⃣ ")
                .replace(/<br>Q4:/, "<br>4️⃣ ");

            div.classList.add("follow-card");
            div.innerHTML = `
                <strong>📝 Follow-up Questions:</strong><br>${cleaned}
            `;
        }

        // FINAL RECOMMENDATION FORMATTING
        else if (text.startsWith("(type: final_recommendation)")) {

            let cleaned = text.replace("(type: final_recommendation)", "").trim();

            const doctor = cleaned.match(/Doctor\/Specialty:\s*(.*)/)?.[1] || "";
            const reason = cleaned.match(/Reason:\s*(.*)/)?.[1] || "";
            const urgency = cleaned.match(/Urgency:\s*(.*)/)?.[1] || "";

            div.classList.add("final-card");
            div.innerHTML = `
                <strong>📌 Final Recommendation</strong><br><br>
                <strong>👨‍⚕️ Doctor/Specialty:</strong> ${doctor}<br>
                <strong>📝 Reason:</strong> ${reason}<br>
                <strong>⚠️ Urgency:</strong> ${urgency}
            `;
        }

        // fallback (regular messages)
        else {
            div.innerHTML = text;
        }

        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }


    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const userText = promptInput.value.trim();
        if (userText === "") return;

        addMessage("user", userText);

        const formData = new FormData();
        formData.append("prompt", userText);

        const response = await fetch("/llm", {
            method: "POST",
            body: formData
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let assistantText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            assistantText += decoder.decode(value);
        }

        addMessage("assistant", assistantText);

        promptInput.value = "";
    });
</script>

</body>
</html>
