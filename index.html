<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Triage Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        #chat-container {
            width: 100%;
            max-width: 650px;
            margin: auto;
            margin-top: 30px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        #messages {
            height: 70vh;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .msg {
            margin: 12px 0;
            padding: 12px;
            border-radius: 10px;
            width: fit-content;
            max-width: 85%;
            line-height: 1.4;
        }

        .user {
            background: #d1e7ff;
            margin-left: auto;
        }

        .assistant {
            background: #e9e9e9;
            margin-right: auto;
        }

        .follow-card {
            background: #fff4d2 !important;
            border-left: 5px solid #f2c200;
        }

        .final-card {
            background: #e3ffd9 !important;
            border-left: 5px solid #54b435;
        }

        #form {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        #prompt {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #aaa;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            background: #007bff;
            color: white;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #005fcc;
        }

        #recordBtn {
            background: #ff3b30;
        }

        #recordBtn.recording {
            background: #9e0000;
        }

        .transcription {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <h2>🩺 Medical Triage Assistant</h2>

    <div id="messages"></div>

    <form id="form">
        <input type="text" id="prompt" placeholder="Describe your symptoms..." required>
        <button type="submit">Send</button>
        <button type="button" id="recordBtn">🎤 Record</button>
    </form>
</div>

<script>
    const form = document.getElementById("form");
    const promptInput = document.getElementById("prompt");
    const messagesDiv = document.getElementById("messages");
    const recordBtn = document.getElementById("recordBtn");

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    function addMessage(role, text) {
        text = text.replace(/^"(.*)"$/, "$1");
        text = text.replace(/\\n/g, "<br>").replace(/\n/g, "<br>");

        const div = document.createElement("div");
        div.classList.add("msg", role);

        // FOLLOW-UP
        if (text.startsWith("(type: follow_up)")) {
            let cleaned = text
                .replace("(type: follow_up)", "")
                .trim()
                .replace(/<br>Q1:/, "<br>1️⃣ ")
                .replace(/<br>Q2:/, "<br>2️⃣ ")
                .replace(/<br>Q3:/, "<br>3️⃣ ")
                .replace(/<br>Q4:/, "<br>4️⃣ ");

            div.classList.add("follow-card");
            div.innerHTML = `<strong>📝 Follow-up Questions:</strong><br>${cleaned}`;
        }

        // FINAL RECOMMENDATION
        else if (text.startsWith("(type: final_recommendation)")) {
            let cleaned = text.replace("(type: final_recommendation)", "").trim();

            const doctor = cleaned.match(/Doctor\/Specialty:\s*(.*)/)?.[1] || "";
            const reason = cleaned.match(/Reason:\s*(.*)/)?.[1] || "";
            const urgency = cleaned.match(/Urgency:\s*(.*)/)?.[1] || "";

            // remove duplicates
            cleaned = cleaned
                .replace(/Doctor\/Specialty:.*\n?/, "")
                .replace(/Reason:.*\n?/, "")
                .replace(/Urgency:.*\n?/, "")
                .trim();

            div.classList.add("final-card");
            div.innerHTML = `
                <strong>📌 Final Recommendation</strong><br><br>
                <strong>👨‍⚕️ Doctor/Specialty:</strong> ${doctor}<br>
                <strong>📝 Reason:</strong> ${reason}<br>
                <strong>⚠️ Urgency:</strong> ${urgency}
            `;
        }

        // NORMAL TEXT
        else {
            div.innerHTML = text;
        }

        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    /* ✉️ TEXT SEND */
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const userText = promptInput.value.trim();
        if (!userText) return;

        addMessage("user", userText);

        const formData = new FormData();
        formData.append("prompt", userText);

        const response = await fetch("/llm", { method: "POST", body: formData });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let assistantText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            assistantText += decoder.decode(value);
        }

        addMessage("assistant", assistantText);
        promptInput.value = "";
    });

    /* 🎤 RECORDING LOGIC */
    recordBtn.addEventListener("click", async () => {

        if (!isRecording) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

            mediaRecorder.onstop = async () => {

                const audioBlob = new Blob(audioChunks, { type: "audio/mp4" });

                const formData = new FormData();
                formData.append("audio", audioBlob, "audio.m4a");

                const response = await fetch("/speech-to-text", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                const transcription = result.transcription;

                // ⭐ Put transcription into textbox
                promptInput.value = transcription;
                promptInput.focus();
            };

            mediaRecorder.start();
            recordBtn.textContent = "⏹ Stop";
            recordBtn.classList.add("recording");
            isRecording = true;

        } else {
            mediaRecorder.stop();
            recordBtn.textContent = "🎤 Record";
            recordBtn.classList.remove("recording");
            isRecording = false;
        }
    });
</script>

</body>
</html>
