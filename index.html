<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Triage Assistant</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap');

        :root {
            --glow-purple: rgba(123, 47, 247, 0.08);
            --glow-blue: rgba(57, 190, 255, 0.08);
            --glow-blue-soft: rgba(57, 190, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, var(--glow-purple), transparent 25%), radial-gradient(circle at 90% 10%, var(--glow-blue), transparent 25%), #f6f7fb;
            display: flex;
            justify-content: center;
            padding: 40px 24px;
            min-height: 100vh;
        }

        /* MAIN CHAT WRAPPER */
        .chat-wrapper {
            width: 95%;
            max-width: 850px;
            height: 92vh;
            background: linear-gradient(135deg, #ffffff 0%, #f5f7ff 100%);
            border-radius: 24px;
            border: 1px solid #eef1ff;
            box-shadow: 0 25px 60px rgba(101, 126, 255, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* HEADER */
        .chat-header {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eef1ff;
            background: linear-gradient(120deg, var(--glow-purple), var(--glow-blue-soft));
        }

        .avatar {
            background: linear-gradient(135deg, #7b2ff7, #d66efd);
            width: 45px;
            height: 45px;
            display: flex;
            color: white;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: 600;
            margin-right: 14px;
            box-shadow: 0 10px 30px rgba(123, 47, 247, 0.25);
        }

        .header-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: #1f2a52;
        }

        .subtitle {
            font-size: 13px;
            color: #5a6480;
        }

        .status-pill {
            margin-left: auto;
            background: rgba(56, 213, 129, 0.12);
            color: #1e8a58;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            border: 1px solid rgba(56, 213, 129, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* DATE DIVIDER */
        .date-divider {
            text-align: center;
            padding: 10px 0;
            font-size: 12px;
            color: #7b84a2;
            border-bottom: 1px solid #eef1ff;
            background: linear-gradient(90deg, var(--glow-purple), transparent 30%, transparent 70%, var(--glow-blue));
        }

        /* CHAT BODY */
        #messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            padding-bottom: 120px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(244, 247, 255, 0.95));
        }

        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #d0d0d0;
            border-radius: 10px;
        }

        /* BUBBLE STYLES */
        .msg {
            max-width: 75%;
            padding: 16px 18px;
            margin: 14px 0;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.45;
            position: relative;
            animation: fadeIn .25s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid transparent;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .assistant {
            background: #f5f6ff;
            margin-right: auto;
            border-bottom-left-radius: 6px;
            border-color: #e2e6ff;
        }

        .user {
            background: linear-gradient(135deg, #7b2ff7, #5b8dff);
            color: #ffffff;
            margin-left: auto;
            border-bottom-right-radius: 6px;
        }

        /* FOLLOW-UP CARD */
        .follow-card {
            background: linear-gradient(135deg, #fff8e5, #fff1c8);
            border-left: 6px solid #ffc83d;
            color: #5f4100;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(255, 200, 61, 0.2);
        }

        /* FINAL CARD */
        .final-card {
            background: linear-gradient(135deg, #e7fff2, #d6f6e9);
            border-left: 6px solid #38c172;
            padding: 18px;
            border-radius: 12px;
            color: #1e6f43;
            font-size: 15px;
            box-shadow: 0 10px 30px rgba(56, 193, 114, 0.18);
        }

        /* SPEAK BUTTON */
        .speak-btn {
            margin-top: 10px;
            padding: 6px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        /* COMPOSER FIXED AT BOTTOM */
        .composer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 18px;
            background: rgba(255, 255, 255, 0.9);
            border-top: 1px solid #eef1ff;
            display: flex;
            gap: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.05);
        }

        .composer input {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #d7def0;
            font-size: 15px;
            background: #f8faff;
            transition: all 0.2s ease;
        }

        .composer input:focus {
            outline: none;
            border-color: #7b2ff7;
            box-shadow: 0 0 0 3px rgba(123, 47, 247, 0.15);
        }

        .btn-send {
            padding: 14px 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, #7b2ff7, #5b8dff);
            border: none;
            color: white;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(123, 47, 247, 0.25);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-record {
            padding: 14px 20px;
            border-radius: 14px;
            background: #ff4d4f;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(255, 77, 79, 0.25);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-record.recording {
            background: #c40000;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
        }

        .btn-send:hover,
        .btn-record:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.08);
        }

        /* INDICATORS */
        .indicator {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: #f1f1f1;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            color: #444;
            display: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .loader-dots::after {
            content: '';
            animation: dots 1.2s infinite;
        }

        @keyframes dots {
            0% {
                content: '.';
            }

            33% {
                content: '..';
            }

            66% {
                content: '...';
            }
        }

        /* ============================================ */
        /* MOBILE RESPONSIVE STYLES */
        /* ============================================ */

        /* TABLET (769px - 1024px) */
        @media (max-width: 1024px) and (min-width: 769px) {
            body {
                padding: 20px 0;
            }

            .chat-wrapper {
                width: 98%;
                height: 95vh;
            }

            .msg {
                max-width: 80%;
            }
        }

        /* MOBILE (≤768px) */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .chat-wrapper {
                width: 100%;
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }

            /* HEADER */
            .chat-header {
                padding: 15px;
                gap: 8px;
                flex-wrap: wrap;
            }

            .avatar {
                width: 40px;
                height: 40px;
                font-size: 14px;
                margin-right: 12px;
            }

            .title {
                font-size: 16px;
            }

            .status-pill {
                margin-left: 0;
                padding: 8px 12px;
                flex: 1 1 100%;
                text-align: center;
            }

            /* DATE DIVIDER */
            .date-divider {
                font-size: 11px;
                padding: 8px 0;
            }

            /* MESSAGES */
            #messages {
                padding: 15px 12px;
                padding-bottom: 140px;
            }

            /* MESSAGE BUBBLES */
            .msg {
                max-width: 85%;
                padding: 12px 15px;
                margin: 10px 0;
                font-size: 14px;
                line-height: 1.5;
            }

            /* CARDS */
            .follow-card,
            .final-card {
                padding: 14px;
                font-size: 14px;
            }

            .final-card div {
                margin-bottom: 8px;
                word-wrap: break-word;
            }

            /* SPEAK BUTTON */
            .speak-btn {
                padding: 8px 14px;
                font-size: 12px;
                margin-top: 8px;
                min-height: 44px;
                /* Touch-friendly */
            }

            /* COMPOSER */
            .composer {
                padding: 12px;
                gap: 8px;
                flex-wrap: wrap;
            }

            .composer input {
                flex: 1 1 100%;
                padding: 12px;
                font-size: 16px;
                /* Prevents zoom on iOS */
                min-height: 44px;
                /* Touch-friendly */
            }

            .btn-send,
            .btn-record {
                flex: 1;
                padding: 12px 16px;
                font-size: 14px;
                min-height: 44px;
                /* Touch-friendly */
                border-radius: 12px;
            }

            /* INDICATORS */
            .indicator {
                bottom: 100px;
                left: 12px;
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        /* SMALL MOBILE (≤480px) */
        @media (max-width: 480px) {
            .title {
                font-size: 15px;
            }

            .avatar {
                width: 36px;
                height: 36px;
                font-size: 13px;
            }

            .msg {
                max-width: 90%;
                padding: 10px 13px;
                font-size: 13px;
            }

            .composer {
                padding: 10px;
            }

            .btn-send,
            .btn-record {
                padding: 10px 12px;
                font-size: 13px;
            }

            .follow-card,
            .final-card {
                padding: 12px;
                font-size: 13px;
            }
        }

        /* LANDSCAPE MOBILE */
        @media (max-height: 500px) and (orientation: landscape) {
            .chat-wrapper {
                height: 100vh;
            }

            #messages {
                padding-bottom: 100px;
            }

            .composer {
                padding: 8px;
            }

            .btn-send,
            .btn-record {
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>
    <div class="chat-wrapper">

        <!-- HEADER -->
        <div class="chat-header">
            <div class="avatar">MT</div>
            <div class="header-text">
                <div class="title">Medical Triage Assistant</div>
                <div class="subtitle">Clinical-grade routing with empathetic guidance</div>
            </div>
            <div class="status-pill">Live</div>
        </div>

        <!-- DATE -->
        <div class="date-divider">
            <script>
                document.write(new Date().toLocaleDateString("en-US", {
                    year: "numeric", month: "long", day: "numeric"
                }));
            </script>
        </div>

        <!-- MESSAGES -->
        <div id="messages"></div>

        <!-- INDICATORS -->
        <div id="recordingIndicator" class="indicator">🎤 Recording<span class="loader-dots"></span></div>
        <div id="transcribingIndicator" class="indicator">⏳ Transcribing<span class="loader-dots"></span></div>
        <div id="audioIndicator" class="indicator">🔊 Playing audio<span class="loader-dots"></span></div>

        <!-- COMPOSER -->
        <form id="form" class="composer">
            <input id="prompt" type="text" placeholder="Describe your symptoms..." autocomplete="off" required>
            <button type="submit" class="btn-send">Send</button>
            <button type="button" id="recordBtn" class="btn-record">Record</button>
        </form>

    </div>


    <script>
        /* DOM REFS */
        const messagesDiv = document.getElementById("messages");
        const promptInput = document.getElementById("prompt");
        const recordBtn = document.getElementById("recordBtn");
        const recordingIndicator = document.getElementById("recordingIndicator");
        const transcribingIndicator = document.getElementById("transcribingIndicator");
        const audioIndicator = document.getElementById("audioIndicator");

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let audioPlayer = null;


        /* ADD MESSAGE FUNCTION */
        function addMessage(role, raw) {
            raw = raw.replace(/^"(.*)"$/, "$1");
            raw = raw.replace(/\\n/g, "<br>").replace(/\n/g, "<br>");

            const div = document.createElement("div");
            div.classList.add("msg", role);

            /* FOLLOW-UP */
            if (raw.startsWith("(type: follow_up)")) {
                let q = raw.replace("(type: follow_up)", "").trim();
                q = q.replace(/Q1:/gi, "").replace(/"/g, "").trim();

                div.innerHTML = `
            <div class="follow-card">
                <strong>📝 Follow-up Question:</strong><br>
                ❓ ${q}
            </div>
        `;
            }

            /* FINAL RECOMMENDATION */
            else if (
                raw.startsWith("(final recommendation)") ||
                raw.startsWith("(type: final_recommendation)")
            ) {
                let txt = raw
                    .replace("(final recommendation)", "")
                    .replace("(type: final_recommendation)", "")
                    .trim();

                const doctor = txt.match(/Doctor\/Specialty:\s*(.*)/)?.[1] || "";
                const reason = txt.match(/Reason:\s*(.*)/)?.[1] || "";
                const urgency = txt.match(/Urgency:\s*(.*)/)?.[1] || "";

                div.innerHTML = `
            <div class="final-card">
                <div style="font-weight:700;margin-bottom:10px;">📌 Final Recommendation</div>
                <div><b>👨‍⚕️ Specialist:</b> ${doctor}</div>
                <div><b>📝 Reason:</b> ${reason}</div>
                <div><b>⚠️ Urgency:</b> ${urgency}</div>
            </div>
        `;
            }

            /* NORMAL TEXT */
            else {
                div.innerHTML = raw;
            }

            /* SPEAK BUTTON */
            if (role === "assistant") {
                const btn = document.createElement("button");
                btn.textContent = "🔊 Speak";
                btn.classList.add("speak-btn");
                btn.onclick = playAudio;
                div.appendChild(btn);
            }

            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }


        /* PLAY AUDIO WITH ERROR HANDLING AND BROWSER FALLBACK */
        async function playAudio(event) {
            // Get the text content from the message bubble
            const messageDiv = event.target.closest('.msg');
            const textContent = messageDiv.textContent.replace('🔊 Speak', '').trim();

            if (audioPlayer) audioPlayer.pause();
            audioIndicator.style.display = "block";

            try {
                const fd = new FormData();
                fd.append("text", textContent);
                const res = await fetch("/text-to-speech", { method: "POST", body: fd });

                // Check if response is OK
                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({ detail: "Unknown error" }));
                    console.warn("Server TTS failed:", errorData.detail);

                    // Fall back to browser-based TTS
                    useBrowserTTS(textContent);
                    return;
                }

                const blob = await res.blob();
                audioPlayer = new Audio(URL.createObjectURL(blob));
                await audioPlayer.play();

                audioPlayer.onended = () => audioIndicator.style.display = "none";

            } catch (error) {
                console.error("TTS error:", error);
                // Fall back to browser-based TTS
                useBrowserTTS(textContent);
            }
        }

        /* BROWSER-BASED TTS FALLBACK */
        function useBrowserTTS(text) {
            audioIndicator.style.display = "none";

            // Check if browser supports speech synthesis
            if (!('speechSynthesis' in window)) {
                alert("Sorry, your browser doesn't support text-to-speech.");
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            // Create speech utterance
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9; // Slightly slower for medical content
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            // Optional: Use a specific voice if available
            const voices = window.speechSynthesis.getVoices();
            const englishVoice = voices.find(voice => voice.lang.startsWith('en'));
            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            // Speak the text
            window.speechSynthesis.speak(utterance);
        }


        /* SEND MESSAGE */
        document.getElementById("form").onsubmit = async e => {
            e.preventDefault();

            const text = promptInput.value.trim();
            if (!text) return;

            addMessage("user", text);

            const fd = new FormData();
            fd.append("prompt", text);

            const response = await fetch("/llm", { method: "POST", body: fd });
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let output = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                output += decoder.decode(value);
            }

            addMessage("assistant", output);
            promptInput.value = "";
        };


        /* RECORDING + TRANSCRIBING */
        recordBtn.onclick = async () => {
            if (!isRecording) {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                isRecording = true;

                recordBtn.classList.add("recording");
                recordingIndicator.style.display = "block";

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

                mediaRecorder.onstop = async () => {
                    recordingIndicator.style.display = "none";
                    transcribingIndicator.style.display = "block";

                    const fd = new FormData();
                    fd.append("audio", new Blob(audioChunks), "audio.m4a");

                    const res = await fetch("/speech-to-text", { method: "POST", body: fd });
                    const data = await res.json();

                    promptInput.value = data.transcription;
                    transcribingIndicator.style.display = "none";
                };

                mediaRecorder.start();
            }

            else {
                isRecording = false;
                recordBtn.classList.remove("recording");
                mediaRecorder.stop();
            }
        };
    </script>

</body>

</html>
